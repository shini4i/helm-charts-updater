[project]
name = "helm-charts-updater"
version = "0.5.0"
description = "Bump a chart's appVersion and version in a separate Helm charts repository when your app is released"
authors = [{ name = "Vadim Gedz", email = "vadims@linux-tech.io" }]
readme = "README.md"
license = "MIT"
requires-python = ">=3.14,<4"
keywords = ["helm", "kubernetes", "charts", "automation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Build Tools",
]
dependencies = [
    "semver>=3.0.4,<4",
    "semantic-version>=2.10.0,<3",
    "GitPython>=3.1.57,<4",
    "environs>=15.1.0,<16",
    "pydantic>=2.13.4,<3",
    "prettytable>=3.18.0,<4",
    "ruamel-yaml>=0.19.0,<0.20",
]

[project.urls]
Repository = "https://github.com/shini4i/helm-charts-updater"

[project.scripts]
helm-charts-updater = "helm_charts_updater.main:cli"

[dependency-groups]
dev = [
    "pytest>=9.1.1,<10",
    "pytest-cov>=7.1.0,<8",
    "pytest-mock>=3.15.1,<4",
    "mypy>=2.3.0,<3",
    "pre-commit>=4.5.1,<5",
]

[build-system]
requires = ["uv_build>=0.11.21,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
# The package lives at the repository root rather than under src/
module-root = ""

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
addopts = "-v --tb=short"
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
    "e2e: End-to-end tests with real git operations",
]

[tool.black]
line-length = 100

[tool.isort]
profile = "black"
force_single_line = true
line_length = 100

[tool.mypy]
python_version = "3.14"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
ignore_missing_imports = true

[tool.coverage.run]
source = ["helm_charts_updater"]
branch = true
omit = ["tests/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]
